<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Model Viewer Hotspot Beispiel</title>
    <script type="module" src="./data/google-model-viewer/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100%;
            height: 600px;
            background-color: #f0f0f0;
        }

        .hotspot {
            color: white;
            background: #4CAF50;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            border: none;
            cursor: pointer;
            padding: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 0px #4CAF50;
            transition: box-shadow 0.3s ease;
        }
        .hotspot:hover {
            box-shadow: 0 0 20px #4CAF50;
        }

        .hotspot-info {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) translateX(-10px);
            left: 30px;
            background-color: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
        .hotspot-info.active {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
    </style>
</head>
<body>


<button onclick="setView(0, 75, 2)">Standard</button>
<button onclick="setView(180, 75, 2)">Drehung 1</button>
<button onclick="setView(300, 45, 2)">Drehung 2</button>

<model-viewer id="model"
    src="./data/3d/atom.glb"
    alt="Ein 3D-Modell"
    
    exposure="1"

    field-of-view="20deg"
    camera-orbit="0deg 75deg auto">

    <button slot="hotspot-1"
        class="hotspot"
        data-position="-30 180 -120"
        data-normal="-1 0 0"
        onclick="showHotspotInfobox(this)">
        <b>i</b>
        <div class="hotspot-info">Elektronen</div>
    </button>

    <button slot="hotspot-2"
        class="hotspot"
        data-position="200 -30 -20"
        data-normal="-1 0 0"
        onclick="showHotspotInfobox(this)">
        <b>i</b>
        <div class="hotspot-info">Ein weiterer Punkt</div>
    </button>

</model-viewer>




    <script>
        
    const modelViewer = document.querySelector("#model");



    /* ------------------------------------------------------------
       HOTSPOT INFOBOXEN
    ------------------------------------------------------------ */
    let activeInfoBox = null;

    function showHotspotInfobox(buttonElement) {
        const infoBox = buttonElement.querySelector('.hotspot-info');

        if (infoBox.classList.contains('active')) {
            infoBox.classList.remove('active');
            activeInfoBox = null;
            return;
        }

        if (activeInfoBox) {
            activeInfoBox.classList.remove('active');
        }

        infoBox.classList.add('active');
        activeInfoBox = infoBox;
    }

    document.addEventListener('click', (event) => {
        if (!activeInfoBox) return;

        const hotspotButton = activeInfoBox.closest('.hotspot');
        if (!hotspotButton.contains(event.target)) {
            activeInfoBox.classList.remove('active');
            activeInfoBox = null;
        }
    });

    /* ------------------------------------------------------------
       KAMERA DREHEN (anstatt das Modell zu drehen!)
       => Hotspots bleiben korrekt an der Modelloberfläche
    ------------------------------------------------------------ */
    function setView(orbitYDeg, orbitXDeg, distanceMeters)
    {
        modelViewer.cameraOrbit = `${orbitYDeg}deg ${orbitXDeg}deg auto`;
    }
</script>

</body>
</html>
