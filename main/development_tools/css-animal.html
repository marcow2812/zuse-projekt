<!DOCTYPE html>
<html>
    <head>
        <title>CSS Animal</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            :root
            {
                --skin-color: #ededed; /* EFEFEF */
                --eye: #070707;
                --nose: #515151;
                --ear-out: #BDBDBD;
            }

            .animal
            {
                position: relative;
                display: block;
                width: 200px;
                aspect-ratio: 25 / 23.5;
                border: 1px solid red;
            }

            .animal .head
            {
                z-index: 2;

                display: block;
                width: 100%;
                height: 100%;
                background-color: var(--skin-color);
                border-radius: 50%;

                position: relative;
            }

            .eye
            {
                display: block;
                width: 7%;
                aspect-ratio: 1 / 1;
                background-color: var(--eye);
                border-radius: 50%;

                position: absolute;
                top: 30%;
            }

            .eye-inner
            {
                display: block;
                width: 16%;
                aspect-ratio: 1 / 1;
                background-color: white;
                border-radius: 50%;
                position: absolute;
                top: calc(40% - 10%);
                left: calc(40% - 10%);
            }

            .eye.left
            {
                left: 28%;
            }
            .eye.right
            {
                
                right: 28%;
            }

            .animal .ear
            {
                z-index: 1;

                display: block;
                background-color: var(--ear-out);
                position: absolute;
                top: 0%;
                width: 28%;
                aspect-ratio: 1 / 1;
                border-radius: 4px 22px 0px 25px;

                /* border-radius: 10% 50% 10% 50% / 90% 40% 90% 40%; */

            }
            .ear.left
            {
                left: 0%;
            }
            .ear.right
            {
                right: 0%;
                transform: scaleX(-1);
            }

            .nose
            {
                display: block;
                background-color: var(--nose);
                position: absolute;
                top: 52%;
                left: calc(50% - 4%);
                width: 8%;
                aspect-ratio: 1 / 0.7;
                border-radius: 90%;
            }

            .mouth
            {
                width: 11%;
                height: 4%;
                border-bottom: 2px solid var(--nose);
                border-radius: 0 0 150px 150px;
                position: absolute;
                bottom: 26%;
                left: 50%;
                transform: translateX(-50%);
            }


        </style>
    </head>
    <body>

        <div class="animal">
            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="head">

                <div class="eye left">
                    <div class="eye-inner"></div>
                </div>
                <div class="eye right">
                    <div class="eye-inner"></div>
                </div>

                <div class="nose"></div>

                <div class="mouth"></div>
            </div>
        </div>


        <script>

        </script>
    </body>
</html>
