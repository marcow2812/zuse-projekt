<!DOCTYPE html>
<html lang="de">
    <head>
        <title>Startseite | Projektarbeit</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <link rel="icon" type="image/png" href="./data/img/favicon.png">
        <meta name="theme-color" content="#62A60E">

        <meta property="og:title" content="Projekt | Konrad-Zuse-Schule Hünfeld">
        <meta property="og:description" content="Der AR-Cube ist ein Non-Profit-Projekt der Konrad-Zuse-Schule Hünfeld. Alle Funktionen befinden sich derzeit noch in der Entwicklungsphase.">
        <meta property="og:site_name" content="Projekt">
        <meta property="og:type" content="website">
        <meta property="og:locale" content="de_DE">
        <meta property="og:image" content="https://marcow2812.github.io/zuse-projekt/main/data/img/zuse_logo_small.png">
        <meta property="og:image:alt" content="Alternativtext">
        <meta property="og:image:type" content="image/jpeg">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">

        <link rel="stylesheet" href="./data/style/style.css?timestamp=<%= new Date().getTime() %>">
        <script language="javascript" type="text/javascript" src="./data/script/script.js?timestamp=<%= new Date().getTime() %>"></script>


        <style>

          body
          {
            overflow: scroll;
          }

.outer-cube
{
  display: grid;
}

.slider {
    width: 200px;
    height: 200px;
    perspective: 600px;
}

.container {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: rotate 20s infinite cubic-bezier(1, -0.75, 0.5, 1.2);
}

/* Jede Fläche */
.slide {
    position: absolute;
    width: 200px;
    height: 200px;
    backface-visibility: hidden;
    border: 1px solid #cccccc;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Seiten im 3D-Raum */
.front  { transform: rotateY(  0deg ) translateZ(100px); }
.back   { transform: rotateY(180deg) translateZ(100px); }
.right  { transform: rotateY( 90deg ) translateZ(100px); }
.left   { transform: rotateY(-90deg ) translateZ(100px); }
.top    { transform: rotateX( 90deg ) translateZ(100px); }
.bottom { transform: rotateX(-90deg ) translateZ(100px); }

.bottom img, .top img
{
  transform: rotateX(180deg);
}

.right img
{
    transform: rotate(-90deg);
}

.left img
{
    transform: rotate(90deg);
}


/* Animation exakt wie im Original */
@keyframes rotate {
    0%, 10% {
        transform: rotateY(0deg) rotateX(0deg);
    }

    15%, 20% {
        transform: rotateY(180deg) rotateX(0deg);
    }

    25%, 35% {
        transform: rotateY(180deg) rotateX(270deg);
    }

    40%, 50% {
        transform: rotateY(180deg) rotateX(90deg);
    }

    55%, 65% {
        transform: rotateY(-90deg) rotateX(90deg);
    }

    70%, 80% {
        transform: rotateY(90deg) rotateX(90deg);
    }

    90%, 95% {
        transform: rotateY(0deg) rotateX(90deg);
    }

    100% {
        transform: rotateY(0deg) rotateX(0deg);
    }
}



.split-container {
  display: flex;
  gap: 10px;
  width: 100%;
}

.box {
  flex: 1;
  min-width: 270px;
}

/* Wenn der Bildschirm zu klein wird */
@media (max-width: 600px) {
  .split-container {
    flex-direction: column;
  }

  .box {
    width: 100%;
  }
}

.box1
{
  padding: 35px 0px 35px 0px;
  place-items: center;
}

.box2
{
    color: #cccccc;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 40px;
    display: flex;
    justify-content: center; /* horizontal */
    align-items: center; 
    text-align: center;
}

.switch-container
{
  background-color: #f7f7f7;
  height: 200px;
  display: flex;
  justify-content: center; /* horizontal */
    align-items: center; 
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

#switch-p {
    color: #cccccc;
}

.green-text {
    color: var(--green);
}




.rainbow-button {
  position: relative;
  /* Die Dicke des Randes hier einstellen */
  padding: 2.5px; 
  border: none;
  background: none;
  cursor: pointer;
  border-radius: 100px; 
  overflow: hidden; 
  display: inline-flex;
  align-items: center;
  justify-content: center;
  mask-image: -webkit-radial-gradient(white, black);
}

.rainbow-button::before {
  content: '';
  position: absolute;
  /* Deutlich größer gewählt, damit beim Drehen keine Lücken entstehen */
  width: 200%;
  height: 500%; 
  background: conic-gradient(
    #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0000ff, #8000ff, #ff00ff, #ff0000
  );
  /* Neue eindeutige Animation */
  animation: rainbow-spin 4s linear infinite;
  /* Zentriert den Ankerpunkt der Drehung */
  top: -200%;
  left: -50%;
  z-index: -1;
}

.button-content {
  background: white;
  color: #1a1a1a;
  padding: 12px 28px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Segoe UI', sans-serif;
  font-size: 18px;
  font-weight: 600;
  z-index: 1;
}

.cart-icon {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* Umbenannte Animation gegen Konflikte */
@keyframes rainbow-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

        </style>

    </head>
    <body onload="setSwitchContainer()">

        <header>

            <img src="./data/img/zuse_logo_small.png">


            <button class="btn" style="position: absolute; right: 5px" onclick="location.href='./explorer.html'">Öffnen</button>

        </header>



        

        <div class="split-container">
            <div class="box box1">

                <!-- Copyright: Animation von https://codepen.io/hrtzt/pen/JdYaEZ -->
                <div class="outer-cube">
                    <div class="slider">
                        <div class="container">
                            <!-- Jeweils ein Bild je Fläche -->
                            <div class="slide front"><img src="./data/img/diashow/img1.png" alt=""></div>
                            <div class="slide back"><img src="./data/img/diashow/img2.png" alt=""></div>
                            <div class="slide right"><img src="./data/img/diashow/img3.png" alt=""></div>
                            <div class="slide left"><img src="./data/img/diashow/img4.png" alt=""></div>
                            <div class="slide top"><img src="./data/img/diashow/img5.png" alt=""></div>
                            <div class="slide bottom"><img src="./data/img/diashow/img6.png" alt=""></div>
                        </div>
                      <div class="shadow"></div>
                    </div>
                </div>

            </div>
            <div class="box box2">
                Entdecke
                <br>
                das
                <br>
                Entdecken
            </div>
        </div>

        <div style="margin-top: 30px; margin-bottom: 30px;" align="center">

            <a href="./explorer.html">
                <button class="rainbow-button">
                    <span class="button-content">
                        Jetzt starten
                    </span>
                </button>
            </a>

        </div>

        <div class="switch-container">
            <p id="switch-p"></p>
        </div>

        


        <script>
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms)); 
          async function setSwitchContainer()
          {

            var liste = [
              "Bildung",
              "Lernen",
              "Entdecken",
              "Experimentieren",
              "Verstehen",
              "Erkunden",
              "Forschen",
              "Unterrichten"
            ]

            var sleeptime = 1700;
            var lettertime = 130;
            
            var lastPart = "neu gedacht";
            var currentValue = "";

            var p = document.getElementById("switch-p");

            while (true)
          {
          

            for (i = 0; i < liste.length; i++)
            {

                var firstPart = liste[i];

                for (j = 0; j < firstPart.length; j++)
                {
                  await sleep(lettertime);
                  currentValue = currentValue + firstPart[j];
                  p.innerHTML = `<span class="green-text">${currentValue}</span> ${lastPart}`;
                }
                await sleep(sleeptime);
                while (currentValue.length > 0)
                {
                  await sleep(lettertime);
                  currentValue = currentValue.slice(0, -1);
                  p.innerHTML = `<span class="green-text">${currentValue}</span> ${lastPart}`;
                }

            }
            
          }
            
            
            
          }

        </script>




        
    </body>
</html>
