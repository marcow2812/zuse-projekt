<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Model Viewer Example</title>

    <script type="module"
        src="./data/google-model-viewer/model-viewer.min.js">
    </script>

    <style>
        model-viewer {
            width: 100vw;
            height: 100vh;
            /* background-color: #c29869; */
            background-color: white;
        }
    </style>
</head>

<body onload="rotateObject(0, 0, 20)">

    <!-- ./data/3d/heart-23.glb -->


    <button onclick="document.getElementById('model').src='./data/3d/atom.glb'">Atom</button>
    <button onclick="document.getElementById('model').src='./data/3d/city_pack_5.glb'">City</button>
    <button onclick="document.getElementById('model').src='./data/3d/Conus_textile-150k-4096_std.glb'">Muschel</button>
    <button onclick="document.getElementById('model').src='./data/3d/da_vinci_code_cryptex.glb'">DaVinci</button>
    <button onclick="document.getElementById('model').src='./data/3d/da_vincis_-_flying_machine.glb'">Flugmaschine</button>
    <button onclick="document.getElementById('model').src='./data/3d/enigma_machine_1934.glb'">Enigma</button>
    <button onclick="document.getElementById('model').src='./data/3d/grand-piano-2114.glb'">Klavier</button>
    <button onclick="document.getElementById('model').src='./data/3d/heart-23.glb'">Herz</button>
    <button onclick="document.getElementById('model').src='./data/3d/leaning_tower_of_pisa.glb'">Schiefer Turm v. Pisa</button>
    <button onclick="document.getElementById('model').src='./data/3d/medieval-architecture-2725.glb'">Haus</button>
    <button onclick="document.getElementById('model').src='./data/3d/pyramid_of_menkaure_giza_pyramid_complex_egypt.glb'">Pyramide</button>
    <button onclick="document.getElementById('model').src='./data/3d/sea_keep_lonely_watcher.glb'">Insel</button>

    <button onclick="document.getElementById('model').src='./data/3d/solar-system/fad1f8a62d3848d0be664339e6f3b1a2.glb'">Sonnensystem 1</button>
    <button onclick="document.getElementById('model').src='./data/3d/solar-system/solar_system (1).glb'">Sonnensystem 2</button>
    <button onclick="document.getElementById('model').src='./data/3d/solar-system/solar_system (2).glb'">Sonnensystem 3</button>
    <button onclick="document.getElementById('model').src='./data/3d/solar-system/solar_system_animation.glb'">Sonnensystem 4</button>
    <button onclick="document.getElementById('model').src='./data/3d/solar-system/solar_system_custom.glb'">Sonnensystem 5</button>
    <button onclick="document.getElementById('model').src='./data/3d/solar-system/solar_system.glb'">Sonnensystem 6</button>

    <button onclick="document.getElementById('model').src='https://www.cbnb.de/model/solar1.glb'">Sonnensystem</button>
    <button onclick="document.getElementById('model').src='./data/3d/solar1.glb'">Sonnensystem</button>


    <model-viewer
        id="model"
        src="./data/3d/sea_keep_lonely_watcher.glb"
        camera-controls
        
        
        
        environment-image="neutral"
        alt="3D Model"
        interaction-prompt="none"
        interaction-prompt-threshold="0">
    </model-viewer>


    <!--

    field-of-view="70deg"
    max-field-of-view="100deg"


    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="45deg"
    exposure="1.2"      Belichtung


    orientation="xdeg ydeg zdeg"	Dreht das Objekt selbst
    camera-orbit="angleY angleX radius"	Steuert die Kamera
    camera-target="x y z"	Zielpunkt der Kamera
    camera-controls	Aktiviert Maus/Touch-Steuerung
    disable-pan	Nur drehen/zoomen, kein Schwenken

    environment-image="neutral"	Umgebungslicht
    exposure="1.0"	Helligkeit
    shadow-intensity="1"	Schattenstärke
    shadow-softness="0–1"	Weiche Schatten

    auto-rotate	Automatische Rotation
    rotation-per-second="30deg"	Geschwindigkeit der Auto-Rotation
    auto-rotate-delay="0"	Verzögerung bis zur Rotation
    animation-name="Idle"	GLB-Animation starten
    animation-loop	Loop aktivieren

    interaction-prompt="none"	Entfernt die Finger-/Hilfsanzeige
    interaction-prompt-threshold="0"	Prompt erscheint nie
    touch-action="none"	Touch deaktivieren

    src="file.glb"	3D-Modell
    poster="bild.webp"	Ladebild
    reveal="interaction"	Modell erst bei Interaktion laden
    loading="lazy"	Lazy Loading
    -->


    
    <script>
        const model = document.getElementById("model");

        function rotateObject(x, y, z)
        {
            model.orientation = `${x}deg ${y}deg ${z}deg`;
        }

        /*
        function rotateJS() {
            // rotation-per-second geht nur per HTML-Attribut

            // oder absolute Ausrichtung:
            model.orientation = "0deg 45deg 0deg";
        }
        */

        /* rotateJS(); */
    </script>


</body>
</html>
