<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Model Viewer Example</title>

    <script type="module"
        src="./data/google-model-viewer/model-viewer.min.js">
    </script>

    <style>
        model-viewer {
            width: 100vw;
            height: 100vh;
            /* background-color: #c29869; */
            background-color: white;
        }
    </style>
</head>

<body>

    <!-- AUTOMATISCHE ROTATION -->
    <model-viewer
        id="model"
        src="./data/3d/heart-23.glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="45deg"
        exposure="1.2"
        environment-image="neutral"
        alt="3D Model"
        interaction-prompt="none"
        interaction-prompt-threshold="0">
    </model-viewer>


    
    <script>
        // Beispiel: Rotation per JavaScript
        const model = document.getElementById("model");

        function rotateJS() {
            // rotation-per-second geht nur per HTML-Attribut
            model.setAttribute("rotation-per-second", "20deg");

            // oder absolute Ausrichtung:
            // model.orientation = "0deg 45deg 0deg";
        }

        rotateJS();
    </script>


</body>
</html>
