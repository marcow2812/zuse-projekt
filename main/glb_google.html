<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Model Viewer Example</title>

    <script type="module"
        src="./data/google-model-viewer/model-viewer.min.js">
    </script>

    <style>
        model-viewer {
            width: 100vw;
            height: 100vh;
            /* background-color: #c29869; */
            background-color: white;
        }
    </style>
</head>

<body onload="rotateObject(0, 0, 0)">

    <model-viewer
        id="model"
        src="./data/3d/medieval-architecture-2725.glb"
        camera-controls
        
        
        
        environment-image="neutral"
        alt="3D Model"
        interaction-prompt="none"
        interaction-prompt-threshold="0">
    </model-viewer>

    <!--
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="45deg"
    exposure="1.2"


    orientation="xdeg ydeg zdeg"	Dreht das Objekt selbst
    camera-orbit="angleY angleX radius"	Steuert die Kamera
    camera-target="x y z"	Zielpunkt der Kamera
    camera-controls	Aktiviert Maus/Touch-Steuerung
    disable-pan	Nur drehen/zoomen, kein Schwenken

    environment-image="neutral"	Umgebungslicht
    exposure="1.0"	Helligkeit
    shadow-intensity="1"	Schattenstärke
    shadow-softness="0–1"	Weiche Schatten

    auto-rotate	Automatische Rotation
    rotation-per-second="30deg"	Geschwindigkeit der Auto-Rotation
    auto-rotate-delay="0"	Verzögerung bis zur Rotation
    animation-name="Idle"	GLB-Animation starten
    animation-loop	Loop aktivieren

    interaction-prompt="none"	Entfernt die Finger-/Hilfsanzeige
    interaction-prompt-threshold="0"	Prompt erscheint nie
    touch-action="none"	Touch deaktivieren

    src="file.glb"	3D-Modell
    poster="bild.webp"	Ladebild
    reveal="interaction"	Modell erst bei Interaktion laden
    loading="lazy"	Lazy Loading
    -->


    
    <script>
        // Beispiel: Rotation per JavaScript
        const model = document.getElementById("model");

        function rotateJS() {
            // rotation-per-second geht nur per HTML-Attribut
            //model.setAttribute("rotation-per-second", "20deg");

            // oder absolute Ausrichtung:
            model.orientation = "0deg 45deg 0deg";
        }

        /* rotateJS(); */

        function rotateObject(x, y, z)
        {
            model.orientation = `${x}deg ${y}deg ${z}deg`;
        }
    </script>


</body>
</html>
