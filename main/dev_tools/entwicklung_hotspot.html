<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Model Viewer Hotspot Beispiel</title>
    <script type="module" src="../data/script/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100%;
            height: 600px;
            background-color: #f0f0f0;
        }

        .hotspot-hint {
            color: white;
            background: red; /* transparent */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            border: none;
            cursor: pointer;
            padding: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: box-shadow 0.3s ease;
        }

        .hotspot-hint:disabled
        {
            border: 3px solid red;
        }

        .hotspot-info {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) translateX(-10px);
            left: 70px;
            background-color: red;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
        .hotspot-info.active {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }


    </style>
</head>
<body>


<button onclick="setView(0, 75, 2)">Standard</button>
<button onclick="setView(180, 75, 2)">Drehung 1</button>
<button onclick="setView(300, 45, 2)">Drehung 2</button>

<model-viewer id="model"
    src="../data/3d/object/zuse-tatort.glb"

    camera-controls
    
    
    environment-image="neutral"
                alt="3D Modell"
                interaction-prompt="none"
                interaction-prompt-threshold="0"

                autoplay

                loading="eager"
                
                ar
                placement="floor"
                ar-modes="webxr"
                touch-action="pan-y"
                camera-controls
                
                shadow-intensity="1">


                <!--
                ar-modes="scene-viewer webxr quick-look"
                -->

    <!--
                   Rechts (+) / Links (-)
                     Oben (+) / Unten (-) (Höhe)
                       Vorne (+) / Hinten (-)
    data-position="X X X"

    Rand von Objekt: 17 ist Rand von Untergrund
    Höhe 4.5 ist Höhe von Tisch
    
    -->

    <!-- Handabdruck auf Stuhl -->
    <button id="hotspot-chair" slot="hotspot-chair"
        class="hotspot-hint"
        data-position="-3.2 6 9.3"
        data-normal="-1 0 0"
        onclick="showHotspotInfobox(this);foundHint('hotspot-chair')">
        <div class="hotspot-info">Blutiger Handabdruck</div>
    </button>

    <!-- Handabdruck auf Stuhl -->
    <button id="hotspot-safe" slot="hotspot-safe"
        class="hotspot-hint"
        data-position="-10.5 6.5 3"
        data-normal="-1 0 0"
        onclick="showHotspotInfobox(this);foundHint('hotspot-safe')">
        <div class="hotspot-info">Blutiger Handabdruck</div>
    </button>


</model-viewer>

<script>
    var found = 0;
    var toFind = 2;

    function foundHint(id)
    {
        document.getElementById(id).disabled = true;
   
        if (found < toFind)
        {
            found ++;
            console.log(found+" von " + toFind + " gefunden");
        }

        if (found == toFind)
        {
            console.log("Gewonnen! Alle gefunden!");
        }
        
    }
</script>

<!--


 <button slot="hotspot-2"
        class="hotspot"
        data-position="200 -30 -20"
        data-normal="-1 0 0"
        onclick="showHotspotInfobox(this)">
        <b>i</b>
        <div class="hotspot-info">Ein weiterer Punkt</div>

    <script>
        
    const modelViewer = document.querySelector("#model");



    /* ------------------------------------------------------------
       HOTSPOT INFOBOXEN
    ------------------------------------------------------------ */
    let activeInfoBox = null;

    function showHotspotInfobox(buttonElement) {
        const infoBox = buttonElement.querySelector('.hotspot-info');

        if (infoBox.classList.contains('active')) {
            infoBox.classList.remove('active');
            activeInfoBox = null;
            return;
        }

        /*
        if (activeInfoBox) {
            activeInfoBox.classList.remove('active');
        }
            */

        infoBox.classList.add('active');
        activeInfoBox = infoBox;
    }

    /*
    document.addEventListener('click', (event) => {
        if (!activeInfoBox) return;

        const hotspotButton = activeInfoBox.closest('.hotspot-hint');
        if (!hotspotButton.contains(event.target)) {
            activeInfoBox.classList.remove('active');
            activeInfoBox = null;
        }
    });
    */

    /* ------------------------------------------------------------
       KAMERA DREHEN (anstatt das Modell zu drehen!)
       => Hotspots bleiben korrekt an der Modelloberfläche
    ------------------------------------------------------------ */
    function setView(orbitYDeg, orbitXDeg, distanceMeters)
    {
        modelViewer.cameraOrbit = `${orbitYDeg}deg ${orbitXDeg}deg auto`;
    }
</script>


</body>
</html>
