<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Model Viewer Hotspot Beispiel</title>
    <script type="module" src="../data/script/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100%;
            height: 600px;
            background-color: #f0f0f0;
        }

        .hotspot-hint {
            color: white;
            background: red;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            border: none;
            cursor: pointer;
            padding: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 0px red;
            transition: box-shadow 0.3s ease;
        }
        .hotspot-hint:hover {
            box-shadow: 0 0 20px red;
        }


    </style>
</head>
<body>


<button onclick="setView(0, 75, 2)">Standard</button>
<button onclick="setView(180, 75, 2)">Drehung 1</button>
<button onclick="setView(300, 45, 2)">Drehung 2</button>

<model-viewer id="model"
    src="../data/3d/object/zuse-tatort.glb"

    camera-controls
    
    
    environment-image="neutral"
                alt="3D Modell"
                interaction-prompt="none"
                interaction-prompt-threshold="0"

                autoplay

                loading="eager"
                
                shadow-intensity="1">

    <!--
                   Rechts (+) / Links (-)
                     Oben (+) / Unten (-)
                       Vorne (+) / Hinten (-)
    data-position="X X X"

    Rand von Objekt: 17 ist Rand von Untergrund
    Höhe 4.5 ist Höhe von Tisch
    
    -->

    <button slot="hotspot-A"
        class="hotspot-hint"
        data-position="-8 4.5 0"
        data-normal="-1 0 0"
        onclick="foundHint()">
    </button>


</model-viewer>

<script>
    var found = 0;
    var toFind = 2;

    function foundHint()
    {
        if (found < toFind)
        {
            found ++;
            alert(found+" von " + toFind + " gefunden");
        }

        if (found == toFind)
        {
            alert("Gewonnen! Alle gefunden!");
        }
        
    }
</script>
