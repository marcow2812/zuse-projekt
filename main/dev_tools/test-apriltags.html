<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - Marker Tracking</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="ui-overlay">
        Status: Suche Marker...<br>
        <small>Halte einen Hiro-Marker (oder QR-Stil) in die Kamera</small>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <img id="bild1" src="https://img.icons8.com/color/512/google-logo.png">
            <img id="bild2" src="https://img.icons8.com/color/512/apple-logo.png">
        </a-assets>

        <a-marker preset="hiro" id="marker-hiro">
            <a-image src="#bild1" position="0 0 0" rotation="-90 0 0" width="1" height="1"></a-image>
            
            <a-box position="0 0.5 0" material="opacity: 0.5; color: #4CC3D9;" scale="0.5 0.5 0.5"></a-box>
        </a-marker>

        <a-marker type="barcode" value="5" id="marker-5">
            <a-image src="#bild2" position="0 0 0" rotation="-90 0 0" width="1" height="1"></a-image>
            <a-sphere position="0 0.5 0" radius="0.4" color="#EF2D5E"></a-sphere>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Logik, um zu erkennen, welcher Marker aktiv ist
        const hiroMarker = document.querySelector('#marker-hiro');
        const barcodeMarker = document.querySelector('#marker-5');
        const overlay = document.querySelector('.ui-overlay');

        hiroMarker.addEventListener('markerFound', () => {
            overlay.innerHTML = "Status: Marker 'Hiro' erkannt!<br><small>Zeige ID 5 für Apple Logo</small>";
        });

        barcodeMarker.addEventListener('markerFound', () => {
            overlay.innerHTML = "Status: Marker ID 5 erkannt!<br><small>Zeige Hiro für Google Logo</small>";
        });

        hiroMarker.addEventListener('markerLost', () => {
            overlay.innerHTML = "Status: Suche Marker...";
        });
    </script>
</body>
</html>
