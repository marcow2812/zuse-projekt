<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AR Cube Orientation</title>

<!-- ARUCO JS -->
<script src="./data/js-aruco/aruco.js"></script>
<script src="./data/js-aruco/cv.js"></script>
<script src="./data/js-aruco/polyfill.js"></script>

<script type="module"
        src="./data/google-model-viewer/model-viewer.min.js">
    </script>

<style>
body{
    margin:0;
    overflow:hidden;
}
canvas{
    width:100vw;
    height:100vh;
    object-fit:cover;
}
model-viewer
{
    position: absolute;
    top: 0px;
    left: 0px;
    width: 250px;;
    height: 125px;
    /* background-color: #c29869; */
    background-color: white;
}
</style>

</head>
<body>

    <model-viewer
        id="model"
        src="./data/3d/heart-23.glb"
        camera-controls
        
        environment-image="neutral"
        alt="3D Model"
        interaction-prompt="none"
        interaction-prompt-threshold="0">
    </model-viewer>

    <script>
        const model = document.getElementById("model");

        function rotateObject(x, y, z)
        {
            model.orientation = `${x}deg ${y}deg ${z}deg`;
        }
    </script>


<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<script>

// ---------------------------------------------------------
// 1) Marker-Bilder (optional)
// ---------------------------------------------------------
const imageCache = {};
const imagesById = {
    1: "./data/img/favicon.png",
    2: "./data/img/favicon.png",
    3: "./data/img/favicon.png",
    4: "./data/img/favicon.png",
    5: "./data/img/favicon.png",
    6: "./data/img/favicon.png"
};

function getImageForId(id){
    if (!imagesById[id]) return null;
    if (imageCache[id]) return imageCache[id];
    const img = new Image();
    img.src = imagesById[id];
    imageCache[id] = img;
    return img;
}


// ---------------------------------------------------------
// 2) Grund-Orientierungen laut Faltmuster
// ---------------------------------------------------------
const baseRot = {
    1: 0,    // oben
    2: 0,    // vorne
    3: 270,  // rechts
    4: 90,   // links
    5: 180,  // unten vorne
    6: 0     // unten
};


// ---------------------------------------------------------
// 3) Marker-Rotation bestimmen
// ---------------------------------------------------------
function getMarkerRotation(corners){
    const dx = corners[1].x - corners[0].x;
    const dy = corners[1].y - corners[0].y;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    let rot = (angle + 360) % 360;

    // Auswahl der 4 ArUco-Orientierungen
    const options = [0,90,180,270];
    let best = 0;
    let diff = 999;

    for (let o of options){
        let d = Math.abs(rot - o);
        if (d < diff){
            diff = d;
            best = o;
        }
    }
    return best;
}


// ---------------------------------------------------------
// 4) Markerfläche (zur Bestimmung des "Haupt"-Markers)
// ---------------------------------------------------------
function markerArea(corners){
    const w = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
    const h = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
    return w * h;
}


// ---------------------------------------------------------
// 5) Cube-Orientierung (Yaw / Pitch / Roll)
// ---------------------------------------------------------
function computeCubeOrientation(visible){

    if (visible.length === 0) return null;

    // stärksten Marker wählen
    visible.sort((a,b)=>b.area - a.area);

    const M = visible[0];

    const id = M.id;
    const rot = M.rot;
    const base = baseRot[id];

    // -----------------------------------------------------
    // YAW = wie viel die Seite gegenüber ihrer Basis gedreht ist
    // -----------------------------------------------------
    let yaw = (base - rot + 360) % 360;

    // -----------------------------------------------------
    // Pitch: Oben / Unten / Seiten
    // -----------------------------------------------------
    let pitch = 0;

    if (id === 1){
        pitch = -90; // wir sehen die Oberseite
    } else if (id === 6){
        pitch = +90; // wir sehen die Unterseite
    } else {
        pitch = 0;   // Seitenflächen
    }

    // -----------------------------------------------------
    // Roll: Bestimmt durch Markerrot + Nachbarschaft
    // -----------------------------------------------------
    let roll = 0;

    // Seitliche Marker 3 (rechts) & 4 (links) kippen unterschiedlich
    if (id === 3){ 
        roll = (360 - rot) % 360;
    }
    else if (id === 4){
        roll = (rot + 180) % 360;
    }
    else if (id === 2){
        roll = rot;         // Vorderseite
    }
    else if (id === 5){
        roll = (rot + 180) % 360; // unten vorne
    }
    else if (id === 1 || id === 6){
        roll = rot; // Top / Bottom
    }

    return {
        yaw: yaw,
        pitch: pitch,
        roll: roll,
        id: id,
        markerRot: rot,
        baseRot: base
    };
}


// ---------------------------------------------------------
// 6) Kamera starten
// ---------------------------------------------------------
/*
const video = document.getElementById("video");
navigator.mediaDevices.getUserMedia({ video:true }).then(stream=>{
    video.srcObject = stream;
});
*/

/*
navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },  // FRONTKAMERA
    audio: false
}).then(stream=>{
    video.srcObject = stream;
}).catch(err=>{
    alert("Konnte Frontkamera nicht starten:", err);
});
*/

async function startFrontCamera() {
    const video = document.getElementById("video");

    // Alle Geräte laden
    let devices = await navigator.mediaDevices.enumerateDevices();

    // Versuchen, Frontkamera per Label zu finden
    let frontCam = devices.find(d =>
        d.kind === "videoinput" &&
        d.label.toLowerCase().includes("front")
    );

    // Falls Labels nicht zugänglich sind → Permission anfordern
    if (!frontCam) {
        await navigator.mediaDevices.getUserMedia({ video: true });
        devices = await navigator.mediaDevices.enumerateDevices();
        frontCam = devices.find(d =>
            d.kind === "videoinput" &&
            d.label.toLowerCase().includes("front")
        );
    }

    // Falls immer noch keine gefunden → erste Kamera nehmen
    if (!frontCam) {
        console.warn("⚠ Keine explizite Frontkamera gefunden – verwende erste Kamera.");
        frontCam = devices.find(d => d.kind === "videoinput");
    }

    // Kamera starten
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: { exact: frontCam.deviceId } },
        audio: false
    });

    video.srcObject = stream;
    console.log("📷 Frontkamera gestartet:", frontCam.label);
}

// Frontkamera jetzt wirklich starten
startFrontCamera();



const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const detector = new AR.Detector();


// ---------------------------------------------------------
// 7) Hauptloop
// ---------------------------------------------------------
function tick(){

    if (video.readyState === video.HAVE_ENOUGH_DATA){

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const markers = detector.detect(imageData);

        let visible = [];

        markers.forEach(marker=>{
            const corners = marker.corners;
            const rot = getMarkerRotation(corners);
            const area = markerArea(corners);

            visible.push({ id: marker.id, rot, corners, area });

            // Debuglinien
            ctx.strokeStyle = "yellow";
            ctx.beginPath();
            for (let i=0; i<4; i++){
                let c = corners[i];
                let n = corners[(i+1)%4];
                ctx.moveTo(c.x, c.y);
                ctx.lineTo(n.x, n.y);
            }
            ctx.stroke();

            // optionales Overlay
            const img = getImageForId(marker.id);
            if (img && img.complete){
                ctx.drawImage(img, corners[0].x, corners[0].y, 80,80);
            }
        });

        if (visible.length > 0){
            const ori = computeCubeOrientation(visible);

            if (ori){
                console.log(
                    `ID: ${ori.id}  |  Yaw: ${ori.yaw}°  Pitch: ${ori.pitch}°  Roll: ${ori.roll}°  MarkerRot: ${ori.markerRot}°`
                );
                rotateObject(ori.yaw, ori.pitch, ori.roll);
            }
        }
    }

    requestAnimationFrame(tick);
}

tick();

</script>

</body>
</html>
