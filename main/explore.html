                async function startTheWebcam() 
                {
                    const headerIcon = document.getElementById("header-icon-cam");

                    try
                    {
                        // Anfrage für Kamera-Zugriff
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: "environment" },
                            audio: false
                        });

                        // Wenn erfolgreich: Video starten
                        video.srcObject = stream;

                        // Icon grün setzen
                        headerIcon.classList.remove("icon-red");
                        headerIcon.classList.add("icon-green");

                        // console.log("Kamerazugriff erlaubt.");
                    } 
                    catch (err) 
                    {
                        // console.error("Kamerazugriff verweigert oder Fehler:", err);

                        // Icon rot setzen
                        headerIcon.classList.remove("icon-green");
                        headerIcon.classList.add("icon-red");
                    }

                    closeWelcomeModal();
                }








                // ArUco-Detector
                const detector = new AR.Detector();

                function drawOverlay(ctx, image, corners)
                {
                    // corners = Array von 4 Punkten [{x,y}, ...] im Uhrzeigersinn: TL, TR, BR, BL
                    const [tl, tr, br, bl] = corners;

                    // Quelle (image)
                    const w = image.width;
                    const h = image.height;

                    // Für einfache Projektion: wir zeichnen das Bild auf den Canvas mit ctx.setTransform
                    // Achtung: das ist eine vereinfachte Variante, keine perfekte perspektivische Verzerrung
                    ctx.save();
                    
                    // Berechne groben Affine-Transform von Bild -> Marker
                    const dx1 = tr.x - tl.x;
                    const dy1 = tr.y - tl.y;
                    const dx2 = bl.x - tl.x;
                    const dy2 = bl.y - tl.y;

                    ctx.setTransform(
                        dx1 / w, dy1 / w,
                        dx2 / h, dy2 / h,
                        tl.x, tl.y
                    );

                    ctx.drawImage(image, 0, 0);
                    ctx.restore();
                }


                function tick()
                {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {

                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;

                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const markers = detector.detect(imageData);

                        markers.forEach(marker => {
                            const corners = marker.corners;

                            // Linien zum Debuggen
                            ctx.strokeStyle = "yellow";
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            corners.forEach((c, i) => {
                                const next = corners[(i+1) % corners.length];
                                ctx.moveTo(c.x, c.y);
                                ctx.lineTo(next.x, next.y);
                            });
                            ctx.stroke();

                            // Bild auf Marker zeichnen
                            if (overlayImg.complete)
                            {
                                // drawOverlay(corners);
                                drawOverlay(ctx, overlayImg, corners);
                                // drawOverlay(ctx, overlayImg, Array.from(corners));
                            }
                        });
                    }
                    requestAnimationFrame(tick);
                }

                requestAnimationFrame(tick);
            </script>
