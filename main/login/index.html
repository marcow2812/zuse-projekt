<!DOCTYPE html>
<html>
    <head>
        <title>Login Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        
        <style>
            :root {
  --primary: #000000;
  --secondary: #FFFFFF;
  --accent: #aefa4c; /* ursprünglich: #FF5E5B - jetzt: #B8FF5B */
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Courier New', monospace;
}

body {
  /* background-color: var(--secondary); */
  background-image: url('../data/img/desk.jpg');
  background-repeat: no-repeat;
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 400px;
  border: 1px solid var(--primary);
  padding: 40px 30px;
  background-color: var(--secondary);
  box-shadow: 8px 8px 0px #919191;
  position: relative;
  border-radius: 12px;
}

.login-container::before {
  content: '';
  position: absolute;
  top: 6px;
  left: 6px;
  right: -6px;
  bottom: -6px;
  border: 1px solid var(--primary);
  z-index: -1;
  border-radius: 12px;
}

h1 {
  color: var(--primary);
  margin-bottom: 30px;
  font-size: 28px;
  font-weight: 700;
  text-align: center;
}

.input-group {
  margin-bottom: 20px;
  position: relative;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: var(--primary);
}

input {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid var(--primary);
  background-color: var(--secondary);
  font-size: 16px;
  outline: none;
  transition: all 0.3s;
}

input:focus {
  box-shadow: 4px 4px 0px var(--primary);
}

button {
  width: 100%;
  padding: 12px;
  background-color: var(--accent);
  color: var(--secondary);
  border: 2px solid var(--primary);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.3s;
}

button:hover {
  box-shadow: 4px 4px 0px var(--primary);
  transform: translate(-2px, -2px);
}

.divider {
  display: flex;
  align-items: center;
  margin: 25px 0;
  color: var(--primary);
  font-weight: bold;
}

.divider::before, .divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid var(--primary);
  margin: 0 10px;
}

.social-login {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.social-btn {
  width: auto;
  padding: 0px 15px 0px 15px;
  height: 50px;
  border: 2px solid var(--primary);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: all 0.3s;
}

.social-btn:hover {
  box-shadow: 4px 4px 0px var(--primary);
  transform: translate(-2px, -2px);
}


        </style>
    </head>
    <body>


        <div class="login-container">
        <h1>ANMELDEN</h1>
        
        <div class="input-group">
            <label for="username">BENUTZERNAME</label>
            <input type="username" id="username" placeholder="••••••••••••••">
        </div>
        
        <div class="input-group">
            <label for="password">PASSWORT</label>
            <input type="password" id="password" placeholder="••••••••••••••">
        </div>
        
        <button type="submit" onclick="setLogin()">ANMELDEN</button>
        
        <div class="divider">ODER</div>
        
        <div class="social-login">
            <div class="social-btn" onclick="alert('Bitte wenden Sie sich an Ihren zuständigen Ansprechpartner!')">Zugang beantragen</div>
            <!-- <div class="social-btn">F</div>
            <div class="social-btn">X</div> -->
        </div>

        <script>
          async function setLogin()
          {
            if(document.getElementById("username").value == null || document.getElementById("username").value.length <= 0)
            {

            }
            else
            {
              window.location.href = "./02." + (document.getElementById('username').value.split("@")[0]).toLowerCase() + "." + await hashText(document.getElementById('username').value + document.getElementById('password').value)+".html?key="+await hashText(document.getElementById('username').value+"."+document.getElementById("password").value)+"&timestamp="+new Date().getTime();
            }
          }
          async function hashText(text){const encoder = new TextEncoder();const data = encoder.encode(text);const hashBuffer = await crypto.subtle.digest("SHA-256", data);const hashArray = Array.from(new Uint8Array(hashBuffer));return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");}
        </script>

        
    </div>

    </body>
</html>
